# Local Cargo config.
#
# `screencapturekit` brings in a Swift FFI bridge that links against
# `@rpath/libswift_Concurrency.dylib` (and friends). For production builds
# Tauri's bundler sets those rpaths up, but `cargo test` runs the raw
# `target/debug/deps/*` executable, which has no idea where to find the
# Swift runtime. Point the linker at the CommandLineTools Swift
# back-deployment dylibs so tests can actually launch.

[target.aarch64-apple-darwin]
rustflags = [
  "-C",
  "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib/swift-5.5/macosx",
  "-C",
  "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C",
  "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib/swift-5.5/macosx",
  "-C",
  "link-arg=-Wl,-rpath,/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
]
